---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      {{ page.date | date: "%Y年%m月%d日" }}
      {% if page.tags %}
        · {% for tag in page.tags %}<span class="tag">#{{ tag }}</span>{% endfor %}
      {% endif %}
    </p>
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <p class="back-link"><a href="{{ '/blog/' | relative_url }}">&larr; 返回文章列表</a></p>
</article>
