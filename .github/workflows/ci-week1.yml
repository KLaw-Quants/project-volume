name: ci-week1
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CBOE_IN: data/UnderlyingOptionsEODCalcs_2023-08-25_cgi_or_historical.csv
  CBOE_NORM_OUT: data/cboe_20230825_norm.csv

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Ensure input exists
        run: |
          test -f "${{ env.CBOE_IN }}" || (echo "Missing: ${{ env.CBOE_IN }}" && exit 1)

      - name: Normalize Cboe sample
        run: |
          python scripts/normalize_cboe.py \
            --in_csv "${{ env.CBOE_IN }}" \
            --snapshot 1545 --r 0.03 --q 0.00 \
            --out_csv "${{ env.CBOE_NORM_OUT }}"

      - name: Build Week1 simple chain (normalized -> minimal schema)
        run: |
          python scripts/build_simple_chain.py "${{ env.CBOE_NORM_OUT }}" data/sample_options_chain.csv
          ls -l data/sample_options_chain.csv

      - name: Run Week1 QC
        run: |
          python notebooks/01_data_qc_template.py
          ls -l data/sample_with_iv.csv

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: week1_outputs
          path: |
            ${{ env.CBOE_NORM_OUT }}
            data/sample_options_chain.csv
            data/sample_with_iv.csv
